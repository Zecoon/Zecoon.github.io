name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  CN_DEPLOY_KEY: ${{ secrets.CN_DEPLOY_KEY }}

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
      - name: Mirror to China server 🇨🇳
        # China mirror (Baidu Cloud, ICP-approved): runs when the CN_DEPLOY_KEY secret is set; the server only lets this key rsync into the site dir
        if: github.event_name != 'pull_request' && env.CN_DEPLOY_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$CN_DEPLOY_KEY" > ~/.ssh/cn_deploy && chmod 600 ~/.ssh/cn_deploy
          echo "180.76.103.200 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMNLaf+maBvkuwvycbUBYULgHiVmPYX8ldf6AsSDsu9C" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/cn_deploy" _site/ deploy@180.76.103.200:/
      - name: Ping IndexNow (Bing / ChatGPT search) 🔎
        # tells IndexNow engines every URL in the sitemap changed; key file is /982b5243e1755a2d8263a9f8fededd2f.txt
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          key = "982b5243e1755a2d8263a9f8fededd2f"
          urls = re.findall(r"<loc>(.*?)</loc>", open("_site/sitemap.xml").read())
          body = json.dumps({"host": "zekunli.com", "key": key, "keyLocation": f"https://zekunli.com/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", body, {"Content-Type": "application/json; charset=utf-8"})
          print(len(urls), "urls ->", urllib.request.urlopen(req, timeout=30).status)
          PY
